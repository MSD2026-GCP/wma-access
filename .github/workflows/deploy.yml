name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - development

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast2
  ARTIFACT_REGISTRY: asia-southeast2-docker.pkg.dev
  PROJECT_KEY: wma
  IMAGE_NAME: wma-dashboard

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Resolve environment config based on branch
  # ──────────────────────────────────────────────────────────────
  setup-env:
    name: 🔧 Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.set-env.outputs.service_name }}
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}

    steps:
      - name: Set environment variables based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "service_name=${{ env.PROJECT_KEY }}-dashboard-prod" >> $GITHUB_OUTPUT
            echo "environment=production"             >> $GITHUB_OUTPUT
            echo "image_tag=prod-${{ github.sha }}"  >> $GITHUB_OUTPUT
          else
            echo "service_name=${{ env.PROJECT_KEY }}-dashboard-dev" >> $GITHUB_OUTPUT
            echo "environment=staging"               >> $GITHUB_OUTPUT
            echo "image_tag=dev-${{ github.sha }}"   >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image & push to Artifact Registry
  # ──────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: setup-env

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.build-push.outputs.image_uri }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js for Automated Testing
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Automated Unit Tests (DoD Quality Gate)
        run: node app.test.js

      # Authenticate to GCP using Service Account JSON Key (Stored in GitHub Secrets)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and push Docker image
        id: build-push
        run: |
          IMAGE_URI="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.PROJECT_KEY }}/${{ env.IMAGE_NAME }}:${{ needs.setup-env.outputs.image_tag }}"

          docker build \
            --tag "$IMAGE_URI" \
            --label "git-sha=${{ github.sha }}" \
            --label "branch=${{ github.ref_name }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $IMAGE_URI"

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Cloud Run (Staging — branch: development)
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup-env, build]
    if: github.ref_name == 'development'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      # Authenticate to GCP using Service Account JSON Key (Stored in GitHub Secrets)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ needs.setup-env.outputs.service_name }}
          image: "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.PROJECT_KEY }}/${{ env.IMAGE_NAME }}:${{ needs.setup-env.outputs.image_tag }}"
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --memory=128Mi
            --cpu=1
            --concurrency=80
            --timeout=60
          env_vars: |
            APP_ENV=staging
            APP_VERSION=${{ github.sha }}

      - name: Show Staging URL
        run: |
          echo "🌐 Staging URL: ${{ steps.deploy.outputs.url }}"

  # ──────────────────────────────────────────────────────────────
  # JOB 4: Deploy to Cloud Run (Production — branch: main)
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup-env, build]
    if: github.ref_name == 'main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      # Authenticate to GCP using Service Account JSON Key (Stored in GitHub Secrets)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (Production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ needs.setup-env.outputs.service_name }}
          image: "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.PROJECT_KEY }}/${{ env.IMAGE_NAME }}:${{ needs.setup-env.outputs.image_tag }}"
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --min-instances=1
            --max-instances=10
            --memory=256Mi
            --cpu=1
            --concurrency=100
            --timeout=60
          env_vars: |
            APP_ENV=production
            APP_VERSION=${{ github.sha }}

      - name: Show Production URL
        run: |
          echo "🌐 Production URL: ${{ steps.deploy.outputs.url }}"
